services:
  api:
    build: .
    container_name: agentic_research_api
    env_file: .env.example
    environment: &app-environment
      DATABASE_URL: sqlite+aiosqlite:////app/data/research_assistant.db
      SYNC_DATABASE_URL: sqlite:////app/data/research_assistant.db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    ports:
      - "8000:8000"
    volumes: &app-volumes
      - data_volume:/app/data
    restart: unless-stopped

  ui:
    build: .
    container_name: agentic_research_ui
    env_file: .env.example
    environment: *app-environment
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "src/agentic_ai_research_assistant/ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
    volumes: *app-volumes
    restart: unless-stopped

volumes:
  data_volume:
