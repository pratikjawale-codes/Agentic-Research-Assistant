[project]
name = "agentic-ai-research-assistant"
version = "0.1.0"
description = "A multi-agent research assistant with document retrieval and verified analysis."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pratik Jawale", email = "psjawale79@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "bcrypt>=5.0.0",
    "duckduckgo-search>=8.1.1",
    "email-validator>=2.3.0",
    "fastapi>=0.143.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.1.4",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3.0"]
gemini = ["langchain-google-genai>=2.0.0"]
anthropic = ["langchain-anthropic>=0.3.0"]

[project.scripts]
agentic-ai-research-assistant = "agentic_ai_research_assistant:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
